<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busca - TECH 7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --t7-black: #090909;
      --t7-panel: #151515;
      --t7-line: #2a2a2a;
      --t7-orange: #ff6a00;
      --t7-text: #f5f5f5;
      --t7-muted: #a7a7a7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: Inter, Arial, sans-serif;
    }
    .top {
      background: var(--t7-black);
      color: var(--t7-text);
      border-bottom: 3px solid var(--t7-orange);
    }
    .bar {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }
    .brand {
      color: #fff;
      text-decoration: none;
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .brand span { color: var(--t7-orange); }
    .search {
      width: min(640px, 100%);
      display: flex;
      border: 1px solid #343434;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      padding: 13px 14px;
      font: 600 14px Inter, sans-serif;
      outline: 0;
    }
    .search button {
      border: 0;
      background: var(--t7-orange);
      color: #fff;
      padding: 0 18px;
      font: 800 13px Inter, sans-serif;
      cursor: pointer;
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 30px auto 48px;
    }
    .summary {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .count {
      color: #666;
      font-size: 14px;
      font-weight: 700;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      padding-bottom: 34px;
    }
    .result-card {
      position: relative;
      min-height: 318px;
      display: flex;
      flex-direction: column;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(145deg, rgba(255,106,0,.12), transparent 38%), var(--t7-panel);
      border: 1px solid var(--t7-line);
      border-radius: 14px;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .result-card:hover {
      transform: translateY(-4px);
      border-color: var(--t7-orange);
      box-shadow: 0 12px 28px rgba(255,106,0,.18);
    }
    .result-card:focus-visible {
      outline: 3px solid rgba(255,106,0,.45);
      outline-offset: 3px;
    }
    .pic {
      width: 100%;
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 16px;
    }
    .pic img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .info {
      flex: 1;
      min-width: 0;
      padding: 16px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tag {
      align-self: flex-start;
      color: #ffcf8a;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      border: 1px solid rgba(255, 207, 138, .28);
      border-radius: 999px;
      padding: 5px 9px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name {
      margin: 0;
      color: #fff;
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 16px;
      line-height: 1.18;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .desc {
      margin: 0;
      color: var(--t7-muted);
      font-size: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cta {
      margin-top: auto;
      color: var(--t7-orange);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      padding-top: 4px;
      white-space: nowrap;
    }
    .empty {
      padding: 28px;
      border: 1px solid #ddd;
      border-radius: 8px;
      color: #555;
      background: #fafafa;
    }
    @media (max-width: 720px) {
      .bar { display: block; padding: 18px 0; }
      .brand { display: inline-block; margin-bottom: 14px; }
      .summary { display: block; }
      .count { margin-top: 8px; }
      .results-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .result-card { min-height: 278px; border-radius: 12px; }
      .pic { height: 138px; padding: 12px; }
      .info { padding: 12px; }
      .name { font-size: 15px; }
      .desc { display: none; }
      .cta { font-size: 11px; }
    }
    @media (min-width: 721px) and (max-width: 1020px) {
      .results-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="bar">
      <a class="brand" href="../index.html">TECH <span>7</span></a>
      <form class="search" action="index.html" method="get">
        <input id="searchInput" name="q" type="search" placeholder="Buscar produto" autocomplete="off">
        <button type="submit">Buscar</button>
      </form>
    </div>
  </header>
  <main>
    <div class="summary">
      <h1 id="searchTitle">Busca</h1>
      <div class="count" id="searchCount"></div>
    </div>
    <div id="searchResults" class="results-grid"></div>
  </main>
  <script src="../_assets/tech7/site-search.js"></script>
</body>
</html>
