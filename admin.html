<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - TECH 7</title>
  <meta name="theme-color" content="#ff6a00">
  <link rel="shortcut icon" href="/favicon.ico?v=tech7-20260615" type="image/x-icon">
  <link rel="icon" href="/favicon.png?v=tech7-20260615" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=tech7-20260615" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface-lowest: #0e0e0e;
      --surface-low: #171717;
      --surface: #131313;
      --surface-high: #242424;
      --surface-variant: #303030;
      --surface-bright: #3a3a3a;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .14);
      --text: #f5f2f0;
      --muted: #a1a1aa;
      --dim: #73737d;
      --primary: #ff6a00;
      --primary-hover: #ff8533;
      --primary-bg: rgba(255, 106, 0, .11);
      --secondary: #acc7ff;
      --tertiary: #4edea3;
      --error: #ffb4ab;
      --warning: #f8c56a;
      --radius: 8px;
      --shadow: 0 20px 70px rgba(0, 0, 0, .42);
      --font-display: "Space Grotesk", system-ui, sans-serif;
      --font-body: Inter, system-ui, sans-serif;
    }

    html[data-admin-theme="light"] {
      color-scheme: light;
      --bg: #f5f6f8;
      --surface-lowest: #ffffff;
      --surface-low: #f0f2f5;
      --surface: #ffffff;
      --surface-high: #e8ebef;
      --surface-variant: #dde2e8;
      --surface-bright: #d2d8e0;
      --line: rgba(15, 23, 42, .12);
      --line-strong: rgba(15, 23, 42, .2);
      --text: #111827;
      --muted: #526071;
      --dim: #6b7280;
      --primary-bg: rgba(255, 106, 0, .12);
      --secondary: #2154a6;
      --tertiary: #067647;
      --error: #b42318;
      --warning: #9a6700;
      --shadow: 0 18px 50px rgba(15, 23, 42, .14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }
    html { font-size: 16px; color-scheme: dark; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 42%, rgba(255, 106, 0, .06), transparent 24rem),
        radial-gradient(circle at 86% 18%, rgba(78, 222, 163, .045), transparent 22rem),
        var(--bg);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .26;
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
    }
    html[data-admin-theme="light"] body {
      background:
        radial-gradient(circle at 12% 42%, rgba(255, 106, 0, .08), transparent 24rem),
        radial-gradient(circle at 86% 18%, rgba(33, 84, 166, .055), transparent 22rem),
        var(--bg);
    }

    button, input, select, textarea { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
      letter-spacing: 0;
    }
    button:disabled { cursor: default; opacity: .5; }
    a { color: inherit; }
    svg { display: block; }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: min(100%, 440px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(28, 27, 27, .9), rgba(13, 13, 13, .96));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .05);
    }
    .login-hero {
      padding: 28px 28px 22px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(255, 106, 0, .18), transparent 55%),
        rgba(255, 255, 255, .02);
    }
    .login-brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark, .avatar {
      display: grid;
      place-items: center;
      flex: none;
      color: #111;
      font-family: var(--font-display);
      font-weight: 800;
      background: var(--primary);
      box-shadow: 0 10px 30px rgba(255, 106, 0, .26);
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: var(--radius);
      font-size: 18px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      font-size: 12px;
    }
    .login-card h1 {
      font-family: var(--font-display);
      font-size: 25px;
      line-height: 1.1;
    }
    .login-card p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }
    .form-stack {
      display: grid;
      gap: 15px;
      padding: 24px 28px 28px;
    }
    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .form-stack label { display: grid; gap: 8px; }
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #101010;
      color: var(--text);
      font-size: 14px;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, .46);
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    textarea {
      min-height: 92px;
      resize: vertical;
    }
    input::placeholder { color: rgba(161, 161, 170, .58); }
    input:focus, select:focus {
      border-color: rgba(255, 106, 0, .75);
      box-shadow: 0 0 0 3px rgba(255, 106, 0, .15), inset 0 2px 5px rgba(0, 0, 0, .5);
      outline: none;
    }
    html[data-admin-theme="light"] input,
    html[data-admin-theme="light"] select,
    html[data-admin-theme="light"] textarea {
      background: #fff;
      color: var(--text);
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, .06);
    }
    input[type="range"] {
      min-height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      accent-color: var(--primary);
    }
    .error {
      display: none;
      margin-top: -3px;
      color: var(--error);
      font-size: 13px;
      font-weight: 800;
    }

    .app-screen { display: none; min-height: 100vh; }
    .layout { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      display: flex;
      width: 268px;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(14, 14, 14, .94);
      box-shadow: 16px 0 55px rgba(0, 0, 0, .28);
      backdrop-filter: blur(20px);
    }
    html[data-admin-theme="light"] .sidebar {
      background: rgba(255, 255, 255, .94);
      box-shadow: 16px 0 45px rgba(15, 23, 42, .08);
    }
    .side-head {
      padding: 24px 22px 18px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(255, 106, 0, .32);
      border-radius: var(--radius);
      color: var(--primary);
      background: var(--primary-bg);
    }
    .side-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
      color: var(--primary);
    }
    .side-title span { color: var(--text); }
    .side-subtitle {
      margin: 6px 0 0 48px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .side-cta {
      margin: 0 22px 18px;
      min-height: 44px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #111;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(255, 106, 0, .25);
      transition: filter .18s ease, transform .18s ease;
    }
    .side-cta:hover { filter: brightness(1.08); }
    .side-cta:active { transform: translateY(1px); }
    .nav {
      display: grid;
      gap: 7px;
      padding: 0 18px 18px;
    }
    .nav button {
      display: flex;
      min-height: 46px;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      text-align: left;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
    }
    .nav button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .045);
      transform: translateX(2px);
    }
    .nav button.active {
      color: var(--primary);
      border-color: rgba(255, 106, 0, .22);
      background: var(--primary-bg);
      box-shadow: 0 10px 28px rgba(255, 106, 0, .1);
    }
    .nav svg, .metric-icon svg { width: 18px; height: 18px; flex: none; }
    .nav span { font-weight: 800; }
    .side-foot {
      margin-top: auto;
      padding: 16px 18px;
      border-top: 1px solid var(--line);
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 52px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .025);
    }
    .user-pill strong { display: block; font-size: 13px; }
    .user-pill span { display: block; color: var(--muted); font-size: 12px; }

    .main {
      min-height: 100vh;
      padding-left: 268px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      min-height: 66px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(19, 19, 19, .76);
      box-shadow: 0 6px 24px rgba(255, 106, 0, .05);
      backdrop-filter: blur(18px);
    }
    html[data-admin-theme="light"] .topbar {
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 6px 24px rgba(15, 23, 42, .06);
    }
    .topbar-left {
      display: flex;
      min-width: min(420px, 48vw);
      align-items: center;
      gap: 14px;
    }
    .search-shell {
      display: flex;
      width: 100%;
      min-height: 42px;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #101010;
      color: var(--muted);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, .46);
    }
    .search-shell input {
      min-height: 40px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    .keycap {
      flex: none;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .status-line {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--tertiary);
      box-shadow: 0 0 0 6px rgba(78, 222, 163, .1), 0 0 14px rgba(78, 222, 163, .55);
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .top-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .mono { font-family: "Fira Code", ui-monospace, SFMono-Regular, Consolas, monospace; }
    .icon-btn {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      transition: background .18s ease, color .18s ease, transform .18s ease;
    }
    .icon-btn:hover { color: var(--primary); background: var(--surface-high); }
    .icon-btn:active { transform: scale(.98); }
    .top-divider {
      width: 1px;
      height: 26px;
      background: var(--line);
    }

    .content {
      width: min(100%, 1400px);
      margin: 0 auto;
      padding: 30px 28px 46px;
    }
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }
    .page-head h1 {
      font-family: var(--font-display);
      font-size: clamp(27px, 3vw, 36px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .page-head p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 15px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .grid-4,
    .sub-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 18px;
    }
    .grid-wide {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
      gap: 18px;
      margin-bottom: 18px;
    }
    .metric, .panel, .sub-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(26, 26, 26, .68);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045);
      backdrop-filter: blur(18px);
    }
    html[data-admin-theme="light"] .metric,
    html[data-admin-theme="light"] .panel,
    html[data-admin-theme="light"] .sub-card,
    html[data-admin-theme="light"] .login-card {
      background: rgba(255, 255, 255, .82);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), 0 12px 30px rgba(15, 23, 42, .06);
    }
    .metric {
      min-height: 138px;
      padding: 18px;
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }
    .metric:hover,
    .sub-card:hover {
      border-color: rgba(255, 106, 0, .3);
      background: rgba(34, 34, 34, .78);
    }
    .metric:hover { transform: translateY(-2px); }
    .metric-icon {
      display: grid;
      width: 34px;
      height: 34px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 999px;
      color: var(--primary);
      background: var(--primary-bg);
    }
    .metric small,
    .sub-card small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .metric strong {
      display: block;
      margin-top: 7px;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1;
    }
    .metric span {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .panel {
      overflow: hidden;
      margin-bottom: 18px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(14, 14, 14, .24);
    }
    html[data-admin-theme="light"] .panel-head {
      background: rgba(248, 250, 252, .86);
    }
    .panel-head h2 {
      font-family: var(--font-display);
      font-size: 19px;
      line-height: 1.1;
    }
    .panel-head p {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .panel-body { padding: 18px; }
    .sub-card {
      padding: 14px;
      background: rgba(36, 36, 36, .72);
    }
    .sub-card strong {
      display: block;
      margin-top: 7px;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 21px;
      line-height: 1.18;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar input { max-width: 330px; }
    .toolbar select { max-width: 260px; }
    .btn {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }
    .btn:hover { box-shadow: 0 10px 20px rgba(0, 0, 0, .14), inset 0 1px 0 rgba(255, 255, 255, .12); }
    .btn:active { transform: translateY(1px); }
    .btn-sm {
      min-height: 34px;
      padding: 7px 11px;
      font-size: 12px;
    }
    .btn-primary {
      background: var(--primary);
      color: #111;
      box-shadow: 0 10px 24px rgba(255, 106, 0, .22);
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-outline {
      border-color: var(--line-strong);
      color: var(--text);
      background: rgba(255, 255, 255, .025);
    }
    .btn-outline:hover {
      border-color: rgba(255, 106, 0, .46);
      color: var(--primary);
      background: var(--primary-bg);
    }
    .btn-green {
      border-color: rgba(78, 222, 163, .28);
      background: rgba(78, 222, 163, .12);
      color: var(--tertiary);
    }
    .btn-red {
      border-color: rgba(255, 180, 171, .28);
      background: rgba(255, 180, 171, .1);
      color: var(--error);
    }
    .row-dirty td { background: rgba(255, 106, 0, .06); }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(12, 12, 12, .4);
    }
    html[data-admin-theme="light"] .table-wrap,
    html[data-admin-theme="light"] .field,
    html[data-admin-theme="light"] .bar-track,
    html[data-admin-theme="light"] .search-shell {
      background: #fff;
    }
    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    th {
      color: var(--muted);
      background: rgba(14, 14, 14, .8);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    td { color: var(--text); }
    tr:hover td { background: rgba(255, 255, 255, .025); }
    tr:last-child td { border-bottom: 0; }
    td strong { color: var(--text); }
    .cell-input {
      min-width: 110px;
      max-width: 180px;
      min-height: 36px;
      font-size: 13px;
    }
    .name-input {
      min-width: 250px;
      max-width: 370px;
    }
    .price-input {
      max-width: 116px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .warning-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 2px 4px 2px 0;
      border: 1px solid rgba(248, 197, 106, .26);
      border-radius: 999px;
      padding: 3px 7px;
      color: var(--warning);
      background: rgba(248, 197, 106, .08);
      font-size: 11px;
      font-weight: 900;
    }
    .os-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .os-form .full { grid-column: 1 / -1; }
    .os-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .os-product-picker {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 10px;
      align-items: end;
    }
    .os-product-results {
      grid-column: 1 / -1;
    }
    .os-product-result {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 10px;
      align-items: center;
    }
    .os-product-result small,
    .os-product-result span {
      grid-column: 1;
    }
    .os-product-result button {
      grid-column: 2;
      grid-row: 1 / span 3;
    }

    .badge {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 900;
    }
    .badge-pending { border-color: rgba(248, 197, 106, .28); background: rgba(248, 197, 106, .1); color: var(--warning); }
    .badge-paid { border-color: rgba(78, 222, 163, .28); background: rgba(78, 222, 163, .1); color: var(--tertiary); }
    .badge-bad { border-color: rgba(255, 180, 171, .28); background: rgba(255, 180, 171, .1); color: var(--error); }
    .badge-info { border-color: rgba(172, 199, 255, .28); background: rgba(172, 199, 255, .1); color: var(--secondary); }

    .bars { display: grid; gap: 13px; }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr auto;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .bar-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #0d0d0d;
    }
    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-hover));
      box-shadow: 0 0 14px rgba(255, 106, 0, .3);
    }
    .bar-fill.green { background: linear-gradient(90deg, #23c98a, var(--tertiary)); box-shadow: 0 0 14px rgba(78, 222, 163, .2); }
    .bar-fill.yellow { background: linear-gradient(90deg, var(--warning), var(--primary)); }

    .order-detail {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .field {
      min-height: 72px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #101010;
    }
    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .field span { color: var(--text); overflow-wrap: anywhere; }
    .empty, .loading, .error-state {
      padding: 42px 14px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }
    .error-state { color: var(--error); }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    .toast {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 9999;
      max-width: min(440px, calc(100vw - 36px));
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: .22s ease;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-success { background: #14532d; }
    .toast-error { background: #7f1d1d; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(255, 255, 255, .14); }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
    @media (max-width: 1120px) {
      .sidebar {
        position: static;
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .side-head { padding-bottom: 12px; }
      .side-cta, .side-foot { display: none; }
      .nav {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        padding: 0 14px 14px;
      }
      .nav button {
        justify-content: center;
        min-height: 44px;
      }
      .nav span { display: none; }
      .main { padding-left: 0; }
      .grid-4, .sub-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-wide, .grid-2 { grid-template-columns: 1fr; }
      .topbar-left { min-width: 0; flex: 1; }
    }
    @media (max-width: 720px) {
      .login-card { border-radius: 12px; }
      .login-hero, .form-stack { padding-left: 22px; padding-right: 22px; }
      .topbar {
        align-items: stretch;
        flex-direction: column;
        padding: 14px;
      }
      .topbar-left { width: 100%; }
      .topbar-actions {
        justify-content: space-between;
        width: 100%;
      }
      .top-meta { white-space: normal; }
      .content { padding: 22px 14px 36px; }
      .page-head {
        align-items: stretch;
        flex-direction: column;
      }
      .toolbar, .toolbar-group {
        align-items: stretch;
        flex-direction: column;
        width: 100%;
      }
      .toolbar input,
      .toolbar select,
      .toolbar .btn,
      .page-head .btn { max-width: none; width: 100%; }
      .grid-4, .sub-grid { grid-template-columns: 1fr; }
      .order-detail { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; gap: 6px; }
      .nav { grid-template-columns: repeat(6, minmax(44px, 1fr)); gap: 6px; }
      .os-form { grid-template-columns: 1fr; }
      .os-product-picker,
      .os-product-result { grid-template-columns: 1fr; }
      .os-product-result button {
        grid-column: 1;
        grid-row: auto;
      }
    }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-hero">
        <div class="login-brand">
          <div class="brand-mark" aria-hidden="true">T7</div>
          <div>
            <h1>TECH 7 Command</h1>
            <p>Console operacional da loja</p>
          </div>
        </div>
      </div>
      <div class="form-stack">
        <label for="usernameInput">Usuário
          <input type="text" id="usernameInput" placeholder="Digite seu usuário" autocomplete="username">
        </label>
        <label for="passwordInput">Senha
          <input type="password" id="passwordInput" placeholder="Digite sua senha" autocomplete="current-password">
        </label>
        <button class="btn btn-primary" id="loginBtn">Entrar no painel</button>
        <div class="error" id="loginError">Credenciais inválidas</div>
      </div>
    </div>
  </div>

  <div class="app-screen" id="appScreen">
    <div class="layout">
      <aside class="sidebar" aria-label="Navegação administrativa">
        <div class="side-head">
          <div class="brand-row">
            <div class="brand-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 17V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10"/>
                <path d="M8 21h8"/>
                <path d="M12 17v4"/>
                <path d="m8 11 2 2 4-5 2 3"/>
              </svg>
            </div>
            <div class="side-title">TECH 7 <span>COMMAND</span></div>
          </div>
          <div class="side-subtitle">Admin Terminal v4.0</div>
        </div>

        <button class="side-cta" type="button" data-tab="service-orders">Nova OS</button>

        <nav class="nav">
          <button type="button" class="active" data-tab="dashboard" aria-label="Dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="7" height="9" x="3" y="3" rx="1"/>
              <rect width="7" height="5" x="14" y="3" rx="1"/>
              <rect width="7" height="9" x="14" y="12" rx="1"/>
              <rect width="7" height="5" x="3" y="16" rx="1"/>
            </svg>
            <span>Dashboard</span>
          </button>
          <button type="button" data-tab="products" aria-label="Produtos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
              <path d="m3.3 7 8.7 5 8.7-5"/>
              <path d="M12 22V12"/>
            </svg>
            <span>Produtos</span>
          </button>
          <button type="button" data-tab="orders" aria-label="Pedidos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="8" cy="21" r="1"/>
              <circle cx="19" cy="21" r="1"/>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h8.76a2 2 0 0 0 1.95-1.57L21 8H5.12"/>
            </svg>
            <span>Pedidos</span>
          </button>
          <button type="button" data-tab="service-orders" aria-label="Ordens de Servico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
              <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
              <path d="M9 15h6"/>
              <path d="M9 11h6"/>
              <path d="M9 19h3"/>
            </svg>
            <span>Ordens de Serviço</span>
          </button>
          <button type="button" data-tab="pricing" aria-label="Motor de preços">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" x2="12" y1="2" y2="22"/>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            <span>Preços</span>
          </button>
          <button type="button" data-tab="reports" aria-label="Relatórios">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18"/>
              <path d="m19 9-5 5-4-4-3 3"/>
            </svg>
            <span>Relatórios</span>
          </button>
          <button type="button" data-tab="settings" aria-label="Configuracoes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>Configurações</span>
          </button>
        </nav>

        <div class="side-foot">
          <div class="user-pill">
            <div class="avatar" aria-hidden="true">AD</div>
            <div>
              <strong>Administrador</strong>
              <span>Acesso total</span>
            </div>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <div class="search-shell" role="search">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
              </svg>
              <input type="text" aria-label="Buscar no sistema" placeholder="Buscar no sistema...">
              <span class="keycap">Ctrl K</span>
            </div>
            <div class="status-line"><span class="dot" aria-hidden="true"></span><span>Sistema operacional</span></div>
          </div>

          <div class="topbar-actions">
            <div class="top-meta mono" id="lastSync">Aguardando dados</div>
            <button class="btn btn-outline btn-sm" id="themeToggle" type="button" aria-pressed="false">Modo claro</button>
            <button class="icon-btn" id="refreshBtn" type="button" aria-label="Atualizar dados">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M3 21v-5h5"/>
                <path d="M3 12a9 9 0 0 1 15.74-6.26L21 8"/>
                <path d="M16 8h5V3"/>
              </svg>
            </button>
            <button class="icon-btn" id="exportBtn" type="button" aria-label="Exportar CSV">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="M7 10l5 5 5-5"/>
                <path d="M12 15V3"/>
              </svg>
            </button>
            <div class="top-divider" aria-hidden="true"></div>
            <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Sair</button>
          </div>
        </header>

        <main class="content">
          <section class="page-head">
            <div>
              <h1 id="pageTitle">Painel de controle</h1>
              <p id="pageSubtitle">Métricas e operação da TECH 7 em tempo real.</p>
            </div>
            <div class="toolbar-group">
              <button class="btn btn-outline btn-sm" type="button" data-tab="products">Abrir produtos</button>
              <button class="btn btn-outline btn-sm" type="button" data-tab="orders">Ver pedidos</button>
              <button class="btn btn-primary btn-sm" type="button" data-tab="service-orders">Nova OS</button>
            </div>
          </section>
          <div class="tab-content active" id="tab-dashboard"></div>
          <div class="tab-content" id="tab-products"></div>
          <div class="tab-content" id="tab-orders"></div>
          <div class="tab-content" id="tab-service-orders"></div>
          <div class="tab-content" id="tab-pricing"></div>
          <div class="tab-content" id="tab-reports"></div>
          <div class="tab-content" id="tab-settings"></div>
        </main>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="assets/js/admin.js"></script>
</body>
</html>
